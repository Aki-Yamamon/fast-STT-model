[project]
name = "voicecmd"
version = "0.1.0"
description = "Local voice command pipeline"
readme = "README.md"
authors = [
    { name = "Aki-Yamamon", email = "mathematics.birds@gmail.com" }
]
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.scripts]
voicecmd = "voicecmd:main"

[project.optional-dependencies]
audio = ["sounddevice", "soundfile"]
stt = ["faster-whisper"]

[dependency-groups]
dev = ["ruff", "pytest"]
eval = ["jiwer"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
